services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: papertrade-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GENERIC_TIMEZONE=Europe/Brussels
      - TZ=Europe/Brussels
      - N8N_SECURE_COOKIE=false
      - PAPERTRADE_INTERNAL_BASE_URL=http://host.docker.internal/papertrade-ai/public
      - PAPERTRADE_INTERNAL_API_KEY=${INTERNAL_N8N_API_KEY}
    volumes:
      - papertrade_n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  papertrade_n8n_data:
    name: papertrade_n8n_data
